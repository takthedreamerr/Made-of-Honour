<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>The Menu — Made of Honour</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=DM+Sans:wght@400;500;600&family=Parisienne&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="mediaqueries.css">

</head>

<body data-page="menu">

  <div id="site-header"></div>

  <main>

    <section class="page-hero compact">

      <p class="eyebrow">
        02 · Dinner
      </p>

      <h1>
        The <em>menu.</em>
      </h1>

      <p>
        Here is a sneak peak of what is in store for the evening, so you can plan your appetite accordingly.
      </p>

    </section>

    <section class="menu-layout section-pad">

      <div class="menu-copy reveal">

        <span class="section-index">
          THE EVENING MENU
        </span>

        <h2>
          Something for<br>
          <em>the whole table.</em>
        </h2>

        <p>
          
        </p>

        <button
          class="button button-dark"
          type="button"
          data-open-image="food-menu.jpg"
          data-image-title="The evening menu"
        >
          View the evening menu
          <span>↗</span>
        </button>

        <p class="image-note">
          
          <code></code>
        </p>

      </div>

      <div class="menu-preview reveal">

        <div class="paper-frame">

          <div class="paper-placeholder">

            <span>MENU</span>

            <strong>
              The evening<br>
              at a glance
            </strong>

            <small>
              Tap “View the evening menu” to take a sneak peak at what's in store for later...
            </small>

          </div>

        </div>

      </div>

    </section>

  </main>

  <div id="site-footer"></div>

  <div id="image-modal"></div>

  <script src="script.js"></script>

</body>
</html>
